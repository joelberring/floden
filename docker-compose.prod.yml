# Floden på en vanlig VPS (S1, docs/DRIFT.md). Mönstret är O-Tids docker-compose.prod.yml (MIT).
# Kräver bredvid filen:
#   .env               FLODEN_DOMAIN (och ev. FLODEN_TAG), se deploy/prod.env.example
#   config.local.toml  [konto] med inloggning = "pa" m.m., se deploy/config.local.toml.example (aldrig i git)
#
# Avbildningen byggs av GitHub Actions efter grön CI på main och hämtas med `docker compose -f docker-compose.prod.yml pull`.
# FLODEN_TAG väljer version (förval main; en commit-sha låser versionen).
name: floden

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  floden:
    logging: *logging
    image: ${FLODEN_IMAGE:-ghcr.io/joelberring/floden}:${FLODEN_TAG:-main}
    build: .
    restart: unless-stopped
    # Minnestak för en CX23 (4 GB): förval 3g (resten till Caddy och systemet). Sätt FLODEN_MEM_LIMIT i .env vid
    # uppgradering (t.ex. 6g på CX33 8 GB eller 12g på CX43 16 GB). Tunga körningar ska gå till arbetarna (S5k).
    mem_limit: ${FLODEN_MEM_LIMIT:-3g}
    environment:
      FLODEN_TILLAT_UTAN_INLOGGNING: ${FLODEN_TILLAT_UTAN_INLOGGNING:-0}
      FLODEN_DEMO: ${FLODEN_DEMO:-1}
      FLODEN_SERVER: ${FLODEN_SERVER:-asgi}
      # S-O1 CX23-förval: isolerade barnprocesser med aktiv RSS-/tidsvakt, samtidighets- och diskvakt.
      FLODEN_EXEKUTOR: ${FLODEN_EXEKUTOR:-process}
      FLODEN_MAX_SAMTIDIGA_BERAKNINGAR: ${FLODEN_MAX_SAMTIDIGA_BERAKNINGAR:-2}
      FLODEN_JOBB_MAX_RAM_MB: ${FLODEN_JOBB_MAX_RAM_MB:-2200}
      FLODEN_JOBB_MAX_TID_S: ${FLODEN_JOBB_MAX_TID_S:-300}
      FLODEN_MIN_LEDIG_DISK_MB: ${FLODEN_MIN_LEDIG_DISK_MB:-500}
      # Automatisk in-container lokal diskstädning (fungerar även utan systemd-timer och utan S3).
      FLODEN_AUTO_STADA_DISK: "${FLODEN_AUTO_STADA_DISK:-1}"
      FLODEN_AUTO_STADA_INTERVALL_TIMMAR: "${FLODEN_AUTO_STADA_INTERVALL_TIMMAR:-24}"
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      # Fail-fast celltak för sänkgrafbygge i Python (förval 4 500 000 celler; 0/tomt = standard).
      FLODEN_MAX_SANKGRAF_CELLER: ${FLODEN_MAX_SANKGRAF_CELLER:-}
      # Uvicorn litar annars bara på X-Forwarded-For från 127.0.0.1, men Caddy kommer från Docker-nätet.
      # "*" är säkert här eftersom Floden inte har någon port utåt (bara Caddy når den, se expose nedan).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      FLODEN_KONTO_GOOGLE_KLIENT_ID: ${FLODEN_KONTO_GOOGLE_KLIENT_ID:-}
      FLODEN_KONTO_GOOGLE_KLIENT_HEMLIGHET: ${FLODEN_KONTO_GOOGLE_KLIENT_HEMLIGHET:-}
      # Krypterar användarnas API-nycklar (sidan Nycklar). Saknas den är nyckelsidan avstängd. docs/DRIFT.md.
      FLODEN_NYCKELHEMLIGHET: ${FLODEN_NYCKELHEMLIGHET:-}
      # Valfri S3-objektlagring (Hetzner Object Storage, avsnitt 4b i docs/ARKITEKTUR-DRIFT.md).
      FLODEN_S3_TYP: ${FLODEN_S3_TYP:-}
      FLODEN_S3_ENDPOINT: ${FLODEN_S3_ENDPOINT:-}
      FLODEN_S3_BUCKET: ${FLODEN_S3_BUCKET:-}
      FLODEN_S3_REGION: ${FLODEN_S3_REGION:-}
      FLODEN_S3_ACCESS_KEY: ${FLODEN_S3_ACCESS_KEY:-}
      FLODEN_S3_SECRET_KEY: ${FLODEN_S3_SECRET_KEY:-}
      FLODEN_S3_PREFIX: ${FLODEN_S3_PREFIX:-}
      FLODEN_LOKAL_CACHE_MAPP: ${FLODEN_LOKAL_CACHE_MAPP:-}
      FLODEN_LOKAL_CACHE_MAX_GB: ${FLODEN_LOKAL_CACHE_MAX_GB:-}
      # Opt-in superadmin MCP-utvecklingsläge (utv_*-verktyg, 0 = avstängt som förval).
      FLODEN_MCP_UTVECKLINGSLAGE: ${FLODEN_MCP_UTVECKLINGSLAGE:-0}
    volumes:
      - ./config.local.toml:/app/config.local.toml:ro
      # Bara på serverns disk tills förrådet (S4) finns. Kontodatabasen är det enda som inte går att räkna om.
      - ./data/konto:/app/data/konto
      - ./data/cache:/app/data/cache
      - ./data/demo:/app/data/demo
      - ./data/lokal:/app/data/lokal
    # Ingen port utåt: bara Caddy når Floden.
    expose:
      - "8765"

  caddy:
    logging: *logging
    image: caddy:2.11.7
    restart: unless-stopped
    depends_on:
      floden:
        condition: service_healthy
    mem_limit: 192m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FLODEN_DOMAIN: ${FLODEN_DOMAIN:?Sätt FLODEN_DOMAIN i .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
