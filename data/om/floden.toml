# Innehållet på sidan "Om Floden" (#/om i appen) och i docs/OM-FLODEN.md.
#
# Källan till båda. De genereras med `python tools/generera_om.py`; `tests/gemensamt/test_om_floden.py`
# kontrollerar att de genererade filerna är i takt med den här filen, att varje sökväg finns, att
# varje belägg (text som ska stå i källfilen) finns där, att körtider och GPU-tider stämmer mot
# benchmarkfilerna i docs/benchmark/ och att inget står som jämförelse utan mätning.
#
# Regler för innehållet (AGENTS.md: mät innan du påstår):
#   - Tal står i strukturerade fält (varde, godkanda, av ...) och visas i appen via webb/src/tal.ts.
#     Löptexten innehåller inga mätta tal.
#   - Metodstatus (skiss/rapport) hämtas ur data/mcp/metodstatus.toml via metodregistret och sätts aldrig här.
#   - Avsnitt A (uppmatt) gäller bara det som är mätt i Floden, med källa i repot. Avsnitt B (andra) gäller bara
#     offentliga uppgifter ur tillverkarnas egen dokumentation, med länk och hämtdatum. Avsnitt C säger att samma fall
#     inte är mätt i Floden och i de andra verktygen. Skriv aldrig "X gånger snabbare än <produkt>" utan en sådan mätning.
#   - Ordlistan i docs/UX-GENOMGANG.md gäller (skyfall, förslag, läget idag, beräkning, fråga, beställning, skiss).

[om]
uppdaterad = "2026-11-25"
ingress = "Floden är en öppen modell som räknar skyfall, dagsljus och sol, ekologi och luft på gatunivå, före och efter ett förslag. Buller finns som metodkärna under utveckling. Floden räknar och språkmodellen äger aldrig ett tal: varje tal har belägg i en beräkning. Den här sidan säger vad Floden kan nu, vad planen är och hur Floden förhåller sig till andra verktyg, med källa för varje uppgift."
status_text = "Alla metoder är skisser: ingen metod är klassad som rapportmetod av en människa."
jamforelse_ingress = "Sidan skiljer strikt på tre saker: det som är uppmätt i Floden, det som andra verktygs tillverkare själva har publicerat, och det som inte är mätt. Det finns ingen mätning av samma fall i Floden och i något annat verktyg."

