[[saknas]]
parameter = "ålder, naturvärde och beståndshöjd för habitat"
text = "NMD saknar uppgifter om skogens ålder, struktur och naturvärde. Resultatet kallas därför potentiell livsmiljö, okänd kvalitet."

[[saknas]]
parameter = "p(d) och d50"
text = "Median och sannolikhet vid länktröskeln saknas i källan (Nacka anger bara max 1 000 och 3 000 effektiva m)."

[[saknas]]
parameter = "separat värde för vägklass och gräsmatta"
text = "Källan har ingen separat klass för större väg och ingen för gräsmatta (NMD 42 innehåller mer än gräsmatta)."

[[saknas]]
parameter = "empiriskt stöd för total barriär"
text = "Sammanställningen finner inget empiriskt belägg för att byggnad, väg eller vatten är totala barriärer; finita värden används."
