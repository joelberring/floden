# Ädellövsamband, Nacka 2020 (NMD). Källa: sammanställningen docs/ekologi/habitatnatverk-svensk-stadsmiljo.md,
# avsnittet "Ädellöv och ek", raden "Nacka 2020. Gammal ädellövskog", och "Motstånd per marktyp".
# Se barrskog-nacka.toml för förklaring av fälten.
format = "floden-habitatnatverk/v1"
natverk_id = "adellov-nacka"
namn = "Ädellövsamband"
underlag = "Nacka 2020"
omfattning = "nmd"
korbar = true
signalarter = ["stjärtmes", "trädgårdssångare", "stenknäck", "skogsduva", "hasselticka", "ekticka", "skeppsvarvsfluga"]
beskrivning = "Samband för arter knutna till gammal ädellövskog. Nackas modell: billigaste väg och korridorer med NMD-friktion. Profilen är bredare än de mest krävande ekinsekternas (till exempel läderbagge)."
biologisk_sakerhet = "låg"
biologisk_sakerhet_text = "Hög för rapportens inställning, låg som artmodell för exempelvis läderbagge (sammanställningen)."
huvudscenario = "1000"

[kalla]
nyckel = "N"
sida = "huvudrapport s. 6-8, bil. 2 s. 1-3, 7, tab. 1"

[habitat]
klasser = [116, 117]
nmd_namn = "ädellövskog (116) och triviallövskog med ädellövinslag (117), fastmark"
typ = "antagande"
sakerhet = "låg"
kalla = "N"
sida = "bil. 2 s. 1-3 (kodurvalet för habitat anges inte i sammanställningen)"
anmarkning = "Habitatdefinitionen i NMD-klasser saknas i källan. Nackas habitat bygger på regionala och kommunala underlag, tidigare karteringar, trädinventeringar och ortofoto; punktträd buffrades 20 m. Floden använder NMD 116-117 som ersättare. Våtmarksklasserna 126-127 tas inte med eftersom motstånd saknas för dem i källan."

[min_area]
varde_ha = 0.25
typ = "expertbedömning"
sakerhet = "hög"
kalla = "N"
sida = "huvudrapport s. 6-8, bil. 2 s. 1-3, 7, tab. 1"
anmarkning = "Minsta färdiga fläck."

[[scenario]]
id = "1000"
namn = "1 000 effektiva m"
troskel_m = 1000
typ = "expertbedömning"
sakerhet = "hög"
kalla = "N"
sida = "huvudrapport s. 6-8, bil. 2 s. 1-3, 7, tab. 1"

[[scenario]]
id = "3000"
namn = "3 000 effektiva m"
troskel_m = 3000
typ = "expertbedömning"
sakerhet = "hög"
kalla = "N"
sida = "huvudrapport s. 6-8, bil. 2 s. 1-3, 7, tab. 1"

[d50_antagande]
regel = "troskel/2"
kvot = 0.5
typ = "antagande"
sakerhet = "låg"
kalla = "D"
sida = "s. 15-16, 19, 25, 33, 41-42"
text = "p saknas i källan; d50 = tröskel/2"
motivering = "Södertälje anger d50 och avklippning med kvoten 0,5 (1 250/2 500, 750/1 500, 500/1 000). Kvoten används här för Nackas trösklar."

[standard_motstand]
varde = 2
typ = "antagande"
sakerhet = "låg"
kalla = "N"
sida = "bil. 2 s. 7, tab. 1 (värdet för NMD 42)"
