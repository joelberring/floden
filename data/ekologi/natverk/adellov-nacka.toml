[[saknas]]
parameter = "motstånd för NMD 126 och 127"
text = "Värden för 126-127 saknas i Nackas tabell 1; antagande 2 (som 124-125) används och redovisas separat i resultatet (antagna_motstand) som typ antagande."

[[saknas]]
parameter = "ålder, naturvärde och trädinventering för habitat"
text = "NMD saknar uppgifter om trädens ålder och naturvärde. Inventerade träd ingår bara om det valfria trädlagret anges (och då utan ålder och hålighet). Resultatet kallas därför potentiell livsmiljö, okänd kvalitet."

[[saknas]]
parameter = "empiriskt stöd för total barriär"
text = "Sammanställningen finner inget empiriskt belägg för att byggnad, väg eller vatten är totala barriärer; finita värden används."
