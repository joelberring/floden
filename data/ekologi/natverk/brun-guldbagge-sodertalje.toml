# Brun guldbagge (Södertälje), Södertälje 2020. Källa: sammanställningen docs/ekologi/habitatnatverk-svensk-stadsmiljo.md.
# Södertälje anger d50 och avklippning, men huvudrapporten saknar den numeriska motståndslistan. Nätverket är därför
# inte körbart (korbar = false) och finns som källa för d50 och för kvoten 0,5 mellan d50 och avklippning.
format = "floden-habitatnatverk/v1"
natverk_id = "brun-guldbagge-sodertalje"
namn = "Brun guldbagge (Södertälje)"
underlag = "Södertälje 2020"
omfattning = "biotop"
korbar = false
korbar_orsak = "Numerisk friktionslista (marktäckestal) och säkra totalbarriärer saknas i den tillgängliga huvudrapporten."
signalarter = ["brun guldbagge"]
beskrivning = "Spridningsanalys för brun guldbagge med Graphab och Conefor. Författarna anger att detaljerade artspecifika spridningsdata saknas."
biologisk_sakerhet = "låg"
biologisk_sakerhet_text = "Hög för d50 som modellinställning, låg för sannolikheten i naturen (sammanställningen)."
huvudscenario = "d50"

[kalla]
nyckel = "D"
sida = "s. 13-16, 32-35"

[habitat]
biotop_beskrivning = "Äldre ädellövmiljöer, träd med hål, mulm eller död ved. Inventerade punktträd och ytor, naturvärdesdata, artfynd och flygbilder."
typ = "modell"
sakerhet = "hög"
kalla = "D"
sida = "s. 13-16, 32-35"

[min_area]
saknas = true
kalla = "D"
sida = "s. 13-16, 32-35"
anmarkning = "Minsta area för alla noder saknas i källan."

[[scenario]]
id = "d50"
namn = "d50 750 och avklippning 1 500 effektiva m"
troskel_m = 1500
d50_m = 750
typ = "modell"
sakerhet = "hög"
kalla = "D"
sida = "s. 13-16, 32-35"
anmarkning = "Antagen spridning. Formen på hela kurvan saknas i huvudrapporten."

[[saknas]]
parameter = "numerisk motståndslista"
text = "Marktäckestal och säkra totalbarriärer saknas i den tillgängliga huvudrapporten (den publicerade filen slutar på s. 53 och innehåller inte den detaljerade listan)."
