# Lagerprofil: Göteborgs Stads öppna baskarta -> Flodens roller (markmodell.lagerprofil).
#
# Göteborgs Stad publicerar öppen baskarta och 3D-stadsmodell i SWEREF 99 12 00 (EPSG:3007)
# under CC0 / öppen datalicens via data.goteborg.se.
#
# Ytornas markslagskoder enligt K1:
#   1 hårdgjort, 2 tak, 3 grönt tak, 4 gräs, 5 skog, 6 berg i dagen, 7 grus, 8 vatten, 9 byggnad.
# Prefixreglerna matchar vanliga lagernamn i Göteborgs öppna baskarta (DWG/DXF/GeoPackage)
# och ska bekräftas mot full leverans vid skarp kommunal körning.

namn = "goteborg_baskarta"
version = 1
beskrivning = "Göteborgs Stads öppna baskarta (EPSG:3007): prefixregler för brytlinjer, byggnader och markslag"

