# Sidokort för IDF-källan "Stockholmsregn 2024". Läses av gemensamt.regn (las_stockholmsregn_2024),
# som kontrollerar kontrollsummorna nedan innan tabellen används.

id = "stockholmsregn-2024"
namn = "Stockholmsregn 2024"
rapport = "Stockholmsregn 2024"
utgivare = "Stockholms stad, trafikkontoret (Skyfallsfunktionen); framtagen av Sweco, DHI och SMHI"
url = "https://miljobarometern.stockholm.se/content/docs/tema/klimat/skyfall/tk-rapport-stockholmsregn-2024.pdf"
tabell = "Tabell 7"
tabell_rubrik = "Skattade blockregns-intensiteter (motsvarande volymer i tabell nederst) för nederbördsdata från Stockholm"
kapitel = "4.1"
sida = 30

# Värdena är UTAN klimatfaktor.
klimatfaktor_ingar = false
rekommenderad_klimatfaktor = 1.4
rekommenderad_klimatfaktor_kalla = "Stockholmsregn 2024, kap. 6.3; faktorn multipliceras med hela regnkurvan (kap. 4.9)"
tidigare_klimatfaktor_staden = 1.25   # stadens faktor när rapporten skrevs; kan väljas

enhet_intensitet = "l/s*ha"
enhet_volym = "mm"
omvandling_till_mm_h = 0.36           # 1 l/(s*ha) = 0.36 mm/h; görs vid inläsning, CSV-filerna är oförändrade

varaktigheter_min = [5, 10, 15, 20, 30, 60, 90, 120, 240, 360, 720, 1440]
aterkomsttider_ar = [1, 2, 5, 10, 20, 30, 50, 100, 200, 500, 1000]

fotnot = "Regnvaraktigheterna 5–20 minuter (rödmarkerade tabellvärden) är utvärderade exklusive 15-minuter Geonor-data."

transkription = """Tabellen är transkriberad ur rapportens PDF av projektets huvudtråd. Kontroll: alla 132 celler uppfyller V = i * D * 0,006 (V i mm, i i l/s*ha, D i min) inom avrundning (intensiteten är avrundad till 0,1 l/s*ha och volymen till 0,1 mm, så |i*D*0,006 - V| <= 0,05*D*0,006 + 0,05; största kvoten mot den toleransen är 0,94, ingen cell över) och intensiteten och volymen är monotona i både varaktighet och återkomsttid."""

tabell6_skillnad = """Rapportens Tabell 6 (kap. 3.8) ger andra 60-minutersvärden än Tabell 7, t.ex. 100 år: 117,9 +- 9,4 l/s*ha mot 127,8 l/s*ha i Tabell 7 (cirka 8 % högre i Tabell 7). Rapporten anger att metoderna inte helt överensstämmer. Tabell 7 används här (beslut i docs/BESLUT.md); Tabell 6 är inte inlagd."""

[filer.intensitet]
fil = "stockholmsregn_2024_tabell7_intensitet_l_s_ha.csv"
enhet = "l/s*ha"
sha256 = "6b4b8c6f4448f2200bfe4a6749f89e961dc9720f2deea7455d65388d91752baa"

[filer.volym]
fil = "stockholmsregn_2024_tabell7_volym_mm.csv"
enhet = "mm"
