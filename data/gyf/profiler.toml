kalla = "Stockholms stad (Exploateringskontoret & Stadsbyggnadskontoret), Grönytefaktor för kvartersmark – Beräkningsmodell och vägledning (Norra Djurgårdsstaden / stadens GYF-handbok); översikt på gronytefaktor.se."
