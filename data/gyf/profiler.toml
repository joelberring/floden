# Svenska kommunprofiler för Grönytefaktor (GYF) på kvartersmark.
#
# STATUS: `skiss` för samtliga profiler. Varje vikt och mappning mot K1 v2-markslag
# ligger öppet i denna konfigurationsfil så att Joel kan granska och justera varje
# parameter utan kodändring. Filens SHA-256 ingår i GYF-resultatet för reproducerbarhet.
#
# K1 v2-markslagskoder (docs/DATAKONTRAKT.md, data/markklasser.toml):
#   0 = okänt          (mappas AVSIKTLIGT INTE -> flaggas alltid i flaggad_area_m2 + varningar)
#   1 = hårdgjort      (asfalt, betong)
#   2 = tak            (tätt tak)
#   3 = grönt tak      (sedumtak / vegetationsklätt tak)
#   4 = gräs           (gräs / öppen vegetation på mark)
#   5 = skog           (skog / träd- och buskmark på mark)
#   6 = berg i dagen   (obebyggd berghäll)
#   7 = grus           (grus / genomsläpplig yta)
#   8 = vatten         (öppen vattenyta)
#   9 = byggnad        (byggnad / tätt tak)
#
# K50-överlagringar (`yt_overlagring`) kan ange mer specifika delfaktorer ovanpå
# markslagsrastret, bl.a. `regnbadd`, `vaxtbadd_bjalklag`, `gront_tak` och `genomslapplig`.
# Vid överlapp mellan flera överlagringar i samma cell gäller listan `overlagring_prioritet`
# från vänster (högst prioritet) till höger (lägst prioritet).

format = "floden-gyf-profiler/v1"
version = "1.0.0"

# =============================================================================
# 1. Stockholms stad – Grönytefaktor för kvartersmark (skiss)
