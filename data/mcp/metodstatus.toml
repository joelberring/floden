# Metodstatus för MCP-verktyget `metoder_lista`: har metoden klassats som `skiss` eller `rapport`?
#
# `skiss` = duger för att utforska och jämföra alternativ; kartor och svar märks som skiss.
# `rapport` = en människa har granskat metoden och beslutat att den får ligga till grund för en formell
# rapport (steg 2, se PLAN.md R3-R4). Ingen metod är klassad som `rapport` än: klassningen är ett
# beslut för projektets ägare och sätts bara här, aldrig av en agent. Metoder som saknas i filen är `skiss`.
#
# `underlag` är det som finns att granska (testsvit, dokument). Det är inget påstående om att
# underlaget räcker.

[defaults]
status = "skiss"
motivering = "Ingen människa har klassat metoden som rapportmetod (beslut om rapportklassning: R4)."

["dagsljus.soltimmar_mark"]
status = "skiss"
underlag = ["testsvit grupp E (docs/VALIDERING.md)", "docs/DAGSLJUS.md"]

["dagsljus.vsc_fasad"]
status = "skiss"
underlag = ["testsvit grupp E (docs/VALIDERING.md)", "docs/DAGSLJUS.md"]

["dagsljus.svf_mark"]
status = "skiss"
underlag = ["testsvit grupp E (docs/VALIDERING.md)", "docs/DAGSLJUS.md"]

["dagsljus.horisont"]
status = "skiss"
underlag = ["testsvit grupp E (docs/VALIDERING.md)", "docs/DAGSLJUS.md"]

["vatten.statisk_fyllning"]
status = "skiss"
underlag = ["testsvit grupp A (A1-A13, docs/VALIDERING.md)", "docs/VATTEN.md"]
anmarkning = "Statisk fyllning: maxdjup i sänkor, inget flöde i tid. Regeltolkningen för takvatten granskas av projektets ägare."

["vatten.dynamik"]
status = "skiss"
underlag = ["testsvit grupp A (A1-A13, docs/VALIDERING.md)", "docs/VATTEN.md"]

["luft.vindkomfort"]
status = "skiss"
underlag = ["docs/LUFT.md avsnitt 6 (L1-L8)"]
anmarkning = "En körning tar mer än tio minuter på CPU."

["luft.halt"]
status = "skiss"
underlag = ["docs/LUFT.md avsnitt 6 (L1-L8)"]

["geometri.lutning"]
status = "skiss"

["ekologi.konnektivitet"]
status = "skiss"
underlag = ["tests/ekologi/test_facit_g.py (G1-G6, analytiska facit)", "tests/ekologi/test_losare_k21.py (G7)", "tests/ekologi/test_natverk.py", "docs/EKOLOGI.md", "docs/ekologi/habitatnatverk-svensk-stadsmiljo.md"]
anmarkning = "Parametrar källbelagda (kommunala modellval), biologisk säkerhet låg. Habitatnätverk med signalarter (data/ekologi/natverk/*.toml) har källa och sida, typ och säkerhet per värde; det som saknas i källan är märkt som saknat eller antagande (till exempel d50 = tröskel/2). Intervallet är källbaserat (lägsta och högsta värde mellan scenarier). Markslagsöversättningen för artprofiler (data/ekologi/markslag.toml) är egna val. Resultatet jämför planalternativ för ett nätverk; det säger inget om verkliga arter och är inte verifierat mot fältdata."