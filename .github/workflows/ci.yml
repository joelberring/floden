name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  kvalitet-och-tester:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Installera Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installera paket och utvecklingsverktyg
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint med ruff
        run: ruff check src tests testsvit

      - name: Typkontroll med mypy
        run: mypy src

      - name: Enhetstester med pytest
        run: pytest

      - name: Verifiera CLI
        run: floden --help

      - name: Kör testsvit grupp A
        run: floden testsvit --grupp A
