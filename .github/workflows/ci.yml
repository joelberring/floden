name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-och-typer:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Installera Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Installera paket och utvecklingsverktyg
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint med ruff
        run: ruff check --output-format=github src tests testsvit

      - name: Typkontroll med mypy
        run: |
          python -c '
          import re, subprocess, sys
          p = subprocess.run(["mypy", "src"], text=True, capture_output=True)
          out = p.stdout + p.stderr
          print(out, end="")
          for line in out.splitlines():
              m = re.match(r"^([^:]+):(\d+): (error|warning): (.*)$", line)
              if m:
                  f, ln, lvl, msg = m.groups()
                  print(f"::{lvl} file={f},line={ln}::{msg}")
          sys.exit(p.returncode)
          '

      - name: Verifiera CLI
        run: floden --help

  bygg-rust:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Cacha Cargo-artefakter
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/lasclip
            rust/tvad_karna

      - name: Bygg lasclip (LAZ, lyft från O-Tid)
        run: cargo build --release --locked --manifest-path tools/lasclip/Cargo.toml

      - name: Bygg tvad_karna (2D-lösaren i Rust)
        run: cargo build --release --locked --manifest-path rust/tvad_karna/Cargo.toml

      - name: Ladda upp Rust-binärer till testjobb
        uses: actions/upload-artifact@v4
        with:
          name: rust-binarer
          retention-days: 1
          path: |
            tools/lasclip/target/release/lasclip
            rust/tvad_karna/target/release/tvad_karna

  tester-utan-rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - namn: webb
            args: tests/webb
          - namn: kommuner
            args: tests/kommuner
          - namn: rapport-och-mcp
            args: tests/rapport tests/floden_mcp
          - namn: domaner
            args: tests/buller tests/dagsljus tests/luft tests/ekologi tests/demovarld tests/rutt tests/benchmark
          # Fångar tests/karna, tests/gemensamt, tests/konto, rotfiler samt alla framtida kataloger (t.ex. tests/e2e).
          - namn: karna-och-ovrigt
            args: >-
              tests
              --ignore=tests/webb
              --ignore=tests/kommuner
              --ignore=tests/rapport
              --ignore=tests/floden_mcp
              --ignore=tests/buller
              --ignore=tests/dagsljus
              --ignore=tests/luft
              --ignore=tests/ekologi
              --ignore=tests/demovarld
              --ignore=tests/rutt
              --ignore=tests/benchmark
              --ignore=tests/tvad
              --ignore=tests/sankgraf
              --ignore=tests/vatten
              --ignore=tests/dynamik
              --ignore=tests/lapp
              --ignore=tests/mark_forluster
              --ignore=tests/markmodell
              --ignore=tests/data_inlasning
              --ignore=tests/lantmateriet
              --ignore=tests/testsvit

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Installera Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Installera paket och utvecklingsverktyg
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enhetstester (${{ matrix.namn }})
        run: python -m pytest -n auto --dist loadfile ${{ matrix.args }}

  vatten-och-rust:
    runs-on: ubuntu-latest
    needs: [bygg-rust]

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Hämta byggda Rust-binärer
        uses: actions/download-artifact@v4
        with:
          name: rust-binarer
          path: .

      - name: Gör Rust-binärer körbara
        run: chmod +x tools/lasclip/target/release/lasclip rust/tvad_karna/target/release/tvad_karna

      - name: Installera Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Installera paket och utvecklingsverktyg
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Enhetstester (vatten, mark, data och testsvit)
        run: >-
          python -m pytest -n auto --dist loadfile
          tests/tvad
          tests/sankgraf
          tests/vatten
          tests/dynamik
          tests/lapp
          tests/mark_forluster
          tests/markmodell
          tests/data_inlasning
          tests/lantmateriet
          tests/testsvit

      - name: Kör testsvit grupp A
        run: floden testsvit --grupp A

  # Sammanfattande statusjobb med samma id som tidigare för smidigt branch-skydd.
  kvalitet-och-tester:
    runs-on: ubuntu-latest
    needs: [lint-och-typer, bygg-rust, tester-utan-rust, vatten-och-rust]
    if: always()

    steps:
      - name: Kontrollera att alla Python- och Rust-jobb lyckades
        run: |
          if [ "${{ needs.lint-och-typer.result }}" != "success" ] || \
             [ "${{ needs.bygg-rust.result }}" != "success" ] || \
             [ "${{ needs.tester-utan-rust.result }}" != "success" ] || \
             [ "${{ needs.vatten-och-rust.result }}" != "success" ]; then
            echo "Ett eller flera CI-jobb misslyckades." >&2
            exit 1
          fi

  webb-klient:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webb

    steps:
      - name: Hämta kod
        uses: actions/checkout@v4

      - name: Installera Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: webb/package-lock.json

      - name: Installera npm-paket (exakt enligt package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Typkontrollera TypeScript
        run: npm run typecheck

      - name: Enhetstester för klienten
        run: npm test

      - name: Bygg webbklient
        run: npm run build
