[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floden"
version = "0.1.0"
description = "Öppen dynamisk skyfallsmodell på gatunivå"
readme = "README.md"
license = { text = "GPL-3.0-or-later AND MIT" }  # src/luft är MIT, se docs/BESLUT.md
requires-python = ">=3.11,<3.14"  # låsta beroenden har färdiga hjul t.o.m. 3.13
authors = [
    { name = "Joel Berring" },
]
dependencies = [
    "numpy==2.1.3",
    "rasterio==1.4.3",
    "pyproj==3.7.0",
    "shapely==2.0.6",
    "geopandas==1.0.1",
    "pyarrow==18.1.0",
    "pillow==11.0.0",
    "scipy==1.14.1",
]

[project.optional-dependencies]
# GPU-backend för luftdelen (CUDA 12) på beräkningsservern
gpu = [
    "cupy-cuda12x>=13",
]
# Figurer i `floden luft demo`
viz = [
    "matplotlib==3.9.2",
]
# pdal kräver C++-biblioteket PDAL installerat på systemet
# (t.ex. via conda-forge `python-pdal` eller systempaket `libpdal-dev`).
laser = [
    "pdal==3.4.5",
]
# Inloggning och konton (src/konto): OIDC-kontroll av ID-token (RS256) kräver cryptography.
# Läget `inloggning = "av"` (standard) importerar inget av detta.
konto = [
    "PyJWT[crypto]==2.15.0",
]
# Floden som MCP-server (src/floden_mcp, `floden mcp`): officiella Python MCP SDK.
mcp = [
    "mcp==2.3.0",
    "python-docx==1.2.0",
    "reportlab==5.0.1",
]
# Rapportexport (src/rapport, R1): Word med python-docx, PDF med reportlab (ren Python, inga
# systemberoenden; typsnittet Bitstream Vera följer med reportlab).
rapport = [
    "python-docx==1.2.0",
    "reportlab==5.0.1",
]
dev = [
    "python-docx==1.2.0",
    "reportlab==5.0.1",
    "pypdf==6.17.0",
    "PyJWT[crypto]==2.15.0",
    "mcp==2.3.0",
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[project.scripts]
floden = "floden.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "testsvit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "pyproj",
    "pyproj.*",
    "rasterio",
    "rasterio.*",
    "geopandas",
    "geopandas.*",
    "pandas",
    "pandas.*",
    "pyogrio",
    "pyogrio.*",
    "shapely",
    "shapely.*",
    "PIL",
    "PIL.*",
    "scipy",
    "scipy.*",
    "matplotlib",
    "matplotlib.*",
    "reportlab",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: långsamt test, körs med FLODEN_LANGSAMMA_TESTER=1"]
pythonpath = ["src"]
