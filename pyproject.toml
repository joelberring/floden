[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floden"
version = "0.1.0"
description = "Öppen dynamisk skyfallsmodell på gatunivå"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Joel Berring" },
]
dependencies = [
    "numpy==2.1.3",
    "rasterio==1.4.3",
    "pyproj==3.7.0",
    "shapely==2.0.6",
    "geopandas==1.0.1",
    "pyarrow==18.1.0",
]

[project.optional-dependencies]
# pdal kräver C++-biblioteket PDAL installerat på systemet
# (t.ex. via conda-forge `python-pdal` eller systempaket `libpdal-dev`).
laser = [
    "pdal==3.4.5",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[project.scripts]
floden = "floden.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "testsvit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyproj", "pyproj.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
